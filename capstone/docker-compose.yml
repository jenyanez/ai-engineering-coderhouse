version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligence_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    networks:
      - intelligence_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: intelligence_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - intelligence_net
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: intelligence_phoenix
    ports:
      - "6006:6006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6006/')\" 2>/dev/null || curl -f http://localhost:6006/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intelligence_net
    restart: unless-stopped

networks:
  intelligence_net:
    driver: bridge

volumes:
  redis_data:
